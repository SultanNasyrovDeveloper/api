[tool.poetry]
name = "minager"
version = "0.0.1"
description = "Minager - mind management tool"
authors = ["Sultan Nasyrov <tightbtctrader@gmail.com>"]
readme = "README.md"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "N",    # pep8-naming
    "RUF",  # ruff-specific rules
    "ASYNC", # flake8-async
    "PTH",  # flake8-use-pathlib
    "TC",   # flake8-type-checking
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function calls in default args (FastAPI Depends pattern)
    "N805",   # first arg named self (pydantic v1 validators)
    "SIM108", # ternary operator (sometimes less readable)
    "TC001",  # move import into TYPE_CHECKING block (breaks runtime annotations)
    "TC002",  # move import into TYPE_CHECKING block
    "TC003",  # move stdlib import into TYPE_CHECKING block
]

[tool.ruff.lint.isort]
known-first-party = ["minager"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802", "S101"]  # allow assert and lowercase test names
"minager/core/surorm/__init__.py" = ["F403", "F405"]
"minager/core/surorm/statements/__init__.py" = ["F403", "F405"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
docstring-code-format = true

[mypy]
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.pytest.ini_options]
pythonpath = "."
addopts = [
    "-v",
    "--strict-markers",
    "--strict-config",
    "--cov=minager",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-fail-under=80",
    "--tb=short",
]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.coverage.run]
source = ["minager"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/__init__.py",
    "*/conftest.py",
    "*/test_*.py",
]

[tool.coverage.report]
show_missing = true
fail_under = 50
skip_covered = false
skip_empty = true
precision = 2

exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "@abstractmethod",
    "@overload",
    "except ImportError",
    "if typing.TYPE_CHECKING:",
]

[tool.poetry.scripts]
migrate = "scripts.migrate:run"

[tool.poetry.dependencies]
python = "^3.12"
fastapi = {extras = ["standard"], version = "^0.135.3"}
pydantic = "^2.12.5"
aiohttp = {extras = ["speedups"], version = "^3.9.3"}
pyjwt = "^2.8.0"
pydantic-settings = "^2.9.1"
yarl = "^1.13.1"
requests = "^2.32.3"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.41"}
sqlmodel = "^0.0.24"
alembic = "^1.16.1"
motor = "^3.7.1"
asyncpg = "^0.30.0"
surrealdb = "^1.0.8"
huggingface-hub = "^1.3.1"
pwdlib = "^0.3.0"
fastapi-users = "^15.0.5"

[tool.poetry.group.dev.dependencies]
ipython = "^8.18.1"
pre-commit = "^3.8.0"
psycopg = "^3.2.9"
ruff = "^0.15.16"


[tool.poetry.group.test.dependencies]
pytest = "^9.0.2"
pytest-asyncio = "^1.3.0"
httpx = "^0.28.1"
pytest-mock = "^3.15.1"
faker = "^40.4.0"
pytest-cov = "^7.0.0"
coverage = "^7.13.4"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
