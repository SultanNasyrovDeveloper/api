[tool.poetry]
name = "mind_palace"
version = "0.0.1"
description = "Minager - mind management tool"
authors = ["Sultan Nasyrov <tightbtctrader@gmail.com>"]
readme = "README.md"

[tool.black]
line-length = 100
skip-string-normalization = true

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.poetry.scripts]
migrate = "scripts.migrate:run"

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.105.0"
uvicorn = {extras = ["standart"], version = "^0.24.0.post1"}
pydantic = {extras = ["email"], version = "^2.5.2"}
aiohttp = {extras = ["speedups"], version = "^3.9.3"}
pyjwt = "^2.8.0"
pydantic-settings = "^2.3.4"
aio-pika = "^9.4.3"
yarl = "^1.13.1"
requests = "^2.32.3"

[tool.poetry.group.dev.dependencies]
ipython = "^8.18.1"
pre-commit = "^3.8.0"

[tool.poetry.group.test.dependencies]
pytest = "^7.4.3"
pytest-asyncio = "^0.23.2"
httpx = "^0.26.0"
pytest-mock = "^3.14.0"
faker = "^35.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
