[tool.poetry]
name = "minager"
version = "0.0.1"
description = "Minager - mind management tool"
authors = ["Sultan Nasyrov <tightbtctrader@gmail.com>"]
readme = "README.md"

[tool.black]
line-length = 110
skip-string-normalization = true

[tool.isort]
profile = "black"

[mypy]
strict_optional = true
check_untyped_defs = true
disable_error_code = "type-arg"

[tool.pytest.ini_options]
pythonpath = "."
addopts = [
    "-v",
    "--strict-markers",
    "--strict-config",
    "--cov=minager",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-fail-under=80",
    "--tb=short",
]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.coverage.run]
source = ["minager"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/__init__.py",
    "*/conftest.py",
    "*/test_*.py",
]

[tool.coverage.report]
show_missing = true
fail_under = 50
skip_covered = false
skip_empty = true
precision = 2

exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "@abstractmethod",
    "@overload",
    "except ImportError",
    "if typing.TYPE_CHECKING:",
]

[tool.poetry.scripts]
migrate = "scripts.migrate:run"

[tool.poetry.dependencies]
python = "^3.12"
fastapi = {extras = ["standard"], version = "^0.135.3"}
pydantic = "^2.12.5"
aiohttp = {extras = ["speedups"], version = "^3.9.3"}
pyjwt = "^2.8.0"
pydantic-settings = "^2.9.1"
aio-pika = "^9.4.3"
yarl = "^1.13.1"
requests = "^2.32.3"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.41"}
sqlmodel = "^0.0.24"
alembic = "^1.16.1"
motor = "^3.7.1"
asyncpg = "^0.30.0"
surrealdb = "^1.0.8"
fastapi-users = {extras = ["sqlalchemy"], version = "^15.0.1"}
huggingface-hub = "^1.3.1"

[tool.poetry.group.dev.dependencies]
ipython = "^8.18.1"
pre-commit = "^3.8.0"
psycopg = "^3.2.9"


[tool.poetry.group.test.dependencies]
pytest = "^9.0.2"
pytest-asyncio = "^1.3.0"
httpx = "^0.28.1"
pytest-mock = "^3.15.1"
faker = "^40.4.0"
pytest-cov = "^7.0.0"
coverage = "^7.13.4"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
